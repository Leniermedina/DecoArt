<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoArt - Productos</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Mismos estilos que en index.html, más los específicos de productos */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding-bottom: 60px;
            background-color: var(--bg-body);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        :root {
            --bg-body: #f9f9f9;
            --text-primary: #333;
            --bg-header: #333;
            --text-header: #fff;
            --bg-card: #fff;
            --border-card: #ddd;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --btn-primary: #28a745;
            --btn-primary-hover: #218838;
            --btn-danger: #dc3545;
            --btn-danger-hover: #c82333;
            --bg-modal: #fff;
            --text-modal: #333;
            --bg-cart-panel: #fff;
            --bg-cart-header: #333;
            --border-cart-item: #ddd;
        }
        body.dark {
            --bg-body: #1a1a2e;
            --text-primary: #eee;
            --bg-header: #0f0f1a;
            --text-header: #fff;
            --bg-card: #16213e;
            --border-card: #2a2a3e;
            --shadow: 0 2px 5px rgba(0,0,0,0.3);
            --btn-primary: #28a745;
            --btn-primary-hover: #2ecc71;
            --bg-modal: #16213e;
            --text-modal: #eee;
            --bg-cart-panel: #16213e;
            --bg-cart-header: #0f0f1a;
            --border-cart-item: #2a2a3e;
        }
        header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 1rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        header.hide { transform: translateY(-100%); }
        nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav-links a { color: var(--text-header); text-decoration: none; margin: 0 0.5rem; padding: 0.5rem; border-radius: 4px; transition: background 0.3s; }
        .nav-links a:hover { background: #555; }
        .idioma button, .dark-mode-toggle {
            background: none;
            border: 1px solid var(--text-header);
            color: var(--text-header);
            padding: 0.3rem 0.6rem;
            margin: 0 0.2rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        .idioma button.active {
            background: var(--text-header);
            color: var(--bg-header);
        }
        .dark-mode-toggle { font-size: 1rem; }
        main { padding: 2rem; max-width: 1200px; margin: auto; margin-top: 80px; }
        .btn {
            display: inline-block;
            background: var(--btn-primary);
            color: #fff;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--btn-primary-hover); }
        .btn-danger { background: var(--btn-danger); }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        .floating-buttons { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .floating-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: var(--shadow); cursor: pointer; border: none; transition: transform 0.2s; }
        .floating-btn:hover { transform: scale(1.1); }
        .floating-btn.cart { background: #ff6600; color: white; }
        .floating-btn.whatsapp { background: #25D366; color: white; }
        .floating-btn .cart-count { position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.8rem; }
        .cart-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--bg-cart-panel);
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }
        .cart-panel.open { right: 0; }
        .cart-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-cart-header);
            color: var(--text-header);
        }
        .cart-panel-header h2 { margin: 0; font-size: 1.2rem; }
        .cart-panel-header .close-panel { background: none; border: none; color: var(--text-header); font-size: 2rem; cursor: pointer; }
        .cart-panel-content { flex: 1; overflow-y: auto; padding: 1rem; }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-cart-item);
        }
        .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .cart-item-details { flex: 1; }
        .cart-item-details h4 { margin: 0 0 0.5rem; }
        .cart-item-details .precio { font-weight: bold; color: var(--btn-primary); }
        .cart-item-controls { display: flex; align-items: center; gap: 0.5rem; }
        .cart-item-controls button { width: 30px; height: 30px; background: #ddd; border: none; border-radius: 4px; cursor: pointer; color: #333; }
        .cart-item-controls span { min-width: 30px; text-align: center; }
        .remove-item { background: var(--btn-danger); color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
        .cart-total { font-size: 1.2rem; font-weight: bold; text-align: right; margin: 1rem 0; }
        .cart-actions { display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap; }
        .empty-cart { text-align: center; padding: 2rem; background: var(--bg-card); border-radius: 8px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-content {
            background: var(--bg-modal);
            color: var(--text-modal);
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h3 { margin-bottom: 1rem; }
        .modal-content input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; }
        .close-modal { background: #ccc; color: #333; }
        .categoria { margin-bottom: 2rem; }
        .categoria h2 { background: var(--bg-card); padding: 0.5rem; border-radius: 4px; color: var(--text-primary); }
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .producto-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .producto-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .producto-card h3 { margin: 0.5rem 0; color: var(--text-primary); }
        .producto-card .precio { font-weight: bold; color: var(--btn-primary); font-size: 1.2rem; }
        .cantidad-control { display: flex; align-items: center; gap: 0.5rem; margin: 1rem 0; }
        .cantidad-control button { width: 30px; height: 30px; background: #ddd; border: none; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }
        .cantidad-control input { width: 50px; text-align: center; border: 1px solid #ddd; border-radius: 4px; padding: 0.3rem; background: var(--bg-card); color: var(--text-primary); }
        .add-to-cart { margin-top: auto; }
        @media (max-width: 600px) {
            nav { flex-direction: column; gap: 1rem; }
            .nav-links { display: flex; flex-wrap: wrap; justify-content: center; }
            main { padding: 1rem; margin-top: 120px; }
            .cart-panel { max-width: 100%; }
        }
    </style>
</head>
<body>
    <header id="main-header">
        <nav>
            <div class="logo">🛒 DecoArt</div>
            <div class="nav-links">
                <a href="index.html" data-i18n="inicio">Inicio</a>
                <a href="productos.html" data-i18n="productos">Productos</a>
                <a href="carrito.html" data-i18n="carrito">Carrito</a>
                <a href="acerca.html" data-i18n="acerca">Acerca de</a>
            </div>
            <div class="idioma">
                <button onclick="setLanguage('es')" id="lang-es">🇪🇸</button>
                <button onclick="setLanguage('en')" id="lang-en">🇺🇸</button>
                <button class="dark-mode-toggle" id="dark-mode-toggle">🌙</button>
            </div>
        </nav>
    </header>

    <main>
        <h1 data-i18n="productos">Productos</h1>
        <div id="productos-container"></div>
    </main>

    <!-- Botones flotantes -->
    <div class="floating-buttons">
        <div class="floating-btn cart" id="cart-floating">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">0</span>
        </div>
        <div class="floating-btn whatsapp" id="whatsapp-floating">
            <i class="fab fa-whatsapp"></i>
        </div>
    </div>

    <!-- Panel lateral del carrito -->
    <aside id="cart-panel" class="cart-panel">
        <div class="cart-panel-header">
            <h2 data-i18n="tuCarrito">Tu Carrito</h2>
            <button class="close-panel">&times;</button>
        </div>
        <div class="cart-panel-content" id="cart-panel-content"></div>
    </aside>

    <!-- Modal WhatsApp -->
    <div id="whatsapp-modal" class="modal">
        <div class="modal-content">
            <h3 data-i18n="enviarPedido">Enviar pedido por WhatsApp</h3>
            <form id="whatsapp-form">
                <input type="text" id="nombre" placeholder="Nombre" data-i18n-placeholder="nombre" required>
                <input type="text" id="apellidos" placeholder="Apellidos" data-i18n-placeholder="apellidos" required>
                <input type="tel" id="telefono" placeholder="Teléfono" data-i18n-placeholder="telefono" required>
                <input type="text" id="direccion" placeholder="Dirección" data-i18n-placeholder="direccion" required>
                <div class="modal-actions">
                    <button type="button" class="btn close-modal" data-i18n="cerrar">Cerrar</button>
                    <button type="submit" class="btn" data-i18n="enviar">Enviar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/carrito.js"></script>
    <script>
        let productosData = [];

        function renderProductos(data) {
            const container = document.getElementById('productos-container');
            container.innerHTML = '';
            data.categorias.forEach(categoria => {
                const categoriaDiv = document.createElement('div');
                categoriaDiv.className = 'categoria';
                const nombreCat = currentLanguage === 'es' ? categoria.nombre_es : categoria.nombre_en;
                categoriaDiv.innerHTML = `<h2>${nombreCat}</h2>`;
                const grid = document.createElement('div');
                grid.className = 'productos-grid';
                categoria.productos.forEach(producto => {
                    const nombreProd = currentLanguage === 'es' ? producto.nombre_es : producto.nombre_en;
                    const card = document.createElement('div');
                    card.className = 'producto-card';
                    card.innerHTML = `
                        <img src="${producto.imagen}" alt="${nombreProd}" onerror="this.src='img/placeholder.jpg'">
                        <h3>${nombreProd}</h3>
                        <p class="precio">${CONFIG.CURRENCY}${producto.precio.toFixed(2)}</p>
                        <div class="cantidad-control">
                            <button class="decrement" data-id="${producto.id}">-</button>
                            <input type="number" min="0" value="0" readonly class="cantidad-input" data-id="${producto.id}">
                            <button class="increment" data-id="${producto.id}">+</button>
                        </div>
                        <button class="btn add-to-cart" data-id="${producto.id}">${t('addToCart')}</button>
                    `;
                    grid.appendChild(card);
                });
                categoriaDiv.appendChild(grid);
                container.appendChild(categoriaDiv);
            });

            document.querySelectorAll('.increment').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const input = document.querySelector(`.cantidad-input[data-id="${id}"]`);
                    input.value = parseInt(input.value) + 1;
                });
            });
            document.querySelectorAll('.decrement').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const input = document.querySelector(`.cantidad-input[data-id="${id}"]`);
                    const newVal = Math.max(0, parseInt(input.value) - 1);
                    input.value = newVal;
                });
            });
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    const input = document.querySelector(`.cantidad-input[data-id="${id}"]`);
                    const cantidad = parseInt(input.value);
                    if (cantidad > 0) {
                        const producto = productosData.find(p => p.id === id);
                        agregarAlCarrito(producto, cantidad);
                        input.value = 0;
                        actualizarContadorCarrito();
                        if (document.getElementById('cart-panel').classList.contains('open')) {
                            renderCartPanel();
                        }
                    }
                });
            });
        }

        fetch('productos.json')
            .then(response => response.json())
            .then(data => {
                data.categorias.forEach(cat => {
                    productosData.push(...cat.productos);
                });
                renderProductos(data);
            })
            .catch(error => console.error('Error cargando productos:', error));

        function updateUILanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
            document.getElementById('lang-es').classList.toggle('active', currentLanguage === 'es');
            document.getElementById('lang-en').classList.toggle('active', currentLanguage === 'en');
            fetch('productos.json')
                .then(res => res.json())
                .then(data => renderProductos(data))
                .catch(err => console.error(err));
        }

        setLanguage(currentLanguage);

        // Dark Mode
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const applyDarkMode = (isDark) => {
            if (isDark) {
                document.body.classList.add('dark');
                darkModeToggle.textContent = '☀️';
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark');
                darkModeToggle.textContent = '🌙';
                localStorage.setItem('darkMode', 'disabled');
            }
        };
        const savedDarkMode = localStorage.getItem('darkMode');
        if (savedDarkMode === 'enabled') applyDarkMode(true);
        else if (savedDarkMode === 'disabled') applyDarkMode(false);
        else applyDarkMode(window.matchMedia('(prefers-color-scheme: dark)').matches);
        darkModeToggle.addEventListener('click', () => applyDarkMode(!document.body.classList.contains('dark')));

        // Header hide on scroll
        let lastScrollTop = 0;
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) header.classList.add('hide');
            else header.classList.remove('hide');
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

        // Panel del carrito
        const cartPanel = document.getElementById('cart-panel');
        const cartFloating = document.getElementById('cart-floating');
        const closePanel = document.querySelector('.close-panel');

        function openCartPanel() { cartPanel.classList.add('open'); renderCartPanel(); }
        function closeCartPanel() { cartPanel.classList.remove('open'); }
        cartFloating.addEventListener('click', openCartPanel);
        closePanel.addEventListener('click', closeCartPanel);
        window.addEventListener('click', (e) => {
            if (!cartPanel.contains(e.target) && !cartFloating.contains(e.target) && cartPanel.classList.contains('open')) closeCartPanel();
        });

        function renderCartPanel() {
            const container = document.getElementById('cart-panel-content');
            const cart = getCart();
            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-cart"><p data-i18n="carritoVacio">${t('carritoVacio')}</p><a href="productos.html" class="btn" data-i18n="seguirComprando">${t('seguirComprando')}</a></div>`;
                return;
            }
            let html = '';
            let totalGeneral = 0;
            cart.forEach(item => {
                const prod = productosData.find(p => p.id === item.id);
                if (!prod) return;
                const nombreProd = currentLanguage === 'es' ? prod.nombre_es : prod.nombre_en;
                const subtotal = prod.precio * item.cantidad;
                totalGeneral += subtotal;
                html += `
                    <div class="cart-item" data-id="${item.id}">
                        <img src="${prod.imagen}" alt="${nombreProd}" onerror="this.src='img/placeholder.jpg'">
                        <div class="cart-item-details">
                            <h4>${nombreProd}</h4>
                            <p class="precio">${CONFIG.CURRENCY}${prod.precio.toFixed(2)}</p>
                        </div>
                        <div class="cart-item-controls">
                            <button class="decrement-cart" data-id="${item.id}">-</button>
                            <span>${item.cantidad}</span>
                            <button class="increment-cart" data-id="${item.id}">+</button>
                        </div>
                        <button class="remove-item" data-id="${item.id}">${t('remove')}</button>
                    </div>
                `;
            });
            html += `<div class="cart-total">${t('total')}: ${CONFIG.CURRENCY}${totalGeneral.toFixed(2)}</div>`;
            html += `<div class="cart-actions">
                <a href="productos.html" class="btn" data-i18n="seguirComprando">${t('seguirComprando')}</a>
                <button class="btn btn-danger" id="vaciar-carrito-panel" data-i18n="vaciarCarrito">${t('vaciarCarrito')}</button>
                <button class="btn" id="enviar-whatsapp-panel" data-i18n="enviarPedido">${t('enviarPedido')}</button>
            </div>`;
            container.innerHTML = html;

            document.querySelectorAll('.increment-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    const item = cart.find(i => i.id === id);
                    actualizarCantidad(id, item.cantidad + 1);
                    renderCartPanel();
                });
            });
            document.querySelectorAll('.decrement-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    const item = cart.find(i => i.id === id);
                    if (item.cantidad > 1) actualizarCantidad(id, item.cantidad - 1);
                    else eliminarDelCarrito(id);
                    renderCartPanel();
                });
            });
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    eliminarDelCarrito(id);
                    renderCartPanel();
                });
            });
            document.getElementById('vaciar-carrito-panel')?.addEventListener('click', () => {
                vaciarCarrito();
                renderCartPanel();
            });
            document.getElementById('enviar-whatsapp-panel')?.addEventListener('click', () => {
                document.getElementById('whatsapp-modal').style.display = 'flex';
            });
        }

        actualizarContadorCarrito();

        // Modal WhatsApp
        const modal = document.getElementById('whatsapp-modal');
        const floatingWhatsApp = document.getElementById('whatsapp-floating');
        const closeModal = document.querySelector('.close-modal');
        floatingWhatsApp.addEventListener('click', () => modal.style.display = 'flex');
        closeModal.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

        document.getElementById('whatsapp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const apellidos = document.getElementById('apellidos').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            if (!nombre || !apellidos || !telefono || !direccion) { alert('Por favor complete todos los campos'); return; }
            const cart = getCart();
            if (cart.length === 0) { alert('El carrito está vacío'); return; }
            try {
                const response = await fetch('productos.json');
                const data = await response.json();
                const productos = data.categorias.flatMap(cat => cat.productos);
                let mensajeWhatsApp = `Buenos días, quiero hacer este pedido:\nMi nombre es ${nombre} ${apellidos}.\nMi número es ${telefono}.\nMi dirección es ${direccion}.\n\nPedido:\n`;
                const pedidoDetalle = [];
                let total = 0;
                cart.forEach(item => {
                    const prod = productos.find(p => p.id === item.id);
                    if (prod) {
                        const nombreProd = currentLanguage === 'es' ? prod.nombre_es : prod.nombre_en;
                        const subtotal = prod.precio * item.cantidad;
                        mensajeWhatsApp += `- ${item.cantidad} x ${nombreProd} (${CONFIG.CURRENCY}${subtotal.toFixed(2)})\n`;
                        total += subtotal;
                        pedidoDetalle.push({ cantidad: item.cantidad, nombre: nombreProd, precio: `${CONFIG.CURRENCY}${prod.precio.toFixed(2)}`, subtotal: `${CONFIG.CURRENCY}${subtotal.toFixed(2)}` });
                    }
                });
                mensajeWhatsApp += `Total: ${CONFIG.CURRENCY}${total.toFixed(2)}`;
                const totalFormateado = `${CONFIG.CURRENCY}${total.toFixed(2)}`;
                window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(mensajeWhatsApp)}`, '_blank');
                const backendUrl = 'https://decoart.onrender.com/api/crear-gist-pedido';
                const resBackend = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, apellidos, telefono, direccion, pedido: pedidoDetalle, total: totalFormateado })
                });
                const result = await resBackend.json();
                if (result.success) console.log('✅ Pedido guardado en GitHub:', result.gistUrl);
                else console.error('❌ Error del backend:', result.error);
            } catch (error) { console.error('Error al procesar el pedido:', error); }
            finally { modal.style.display = 'none'; document.getElementById('whatsapp-form').reset(); }
        });
    </script>
</body>
</html>
